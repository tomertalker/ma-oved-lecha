function chips(path, key, opt={}){
  const val = getP(path); const multi=Array.isArray(val); const max=opt.max||0;
  return `<div class="chips ${opt.wrap||""}">${O[key].map(([v,l])=>{
    const on = multi ? val.includes(v) : val===v;
    const dis = multi && max && !on && val.length>=max;
    return `<button type="button" class="chip ${opt.cls||""}" data-p="${path}" data-v="${esc(v)}" aria-pressed="${on}" ${dis?"disabled":""}>${esc(l)}</button>`;
  }).join("")}</div>`;
}
function chipsFrom(path, list){
  const val=getP(path);
  return `<div class="chips">${list.map(([v,l])=>`<button type="button" class="chip" data-p="${path}" data-v="${esc(v)}" aria-pressed="${Array.isArray(val)?val.includes(v):val===v}">${esc(l)}</button>`).join("")}</div>`;
}

function summaryHTML(){
  const rated=S.picks.map(pk=>({pk,r:S.ratings[pk.key]})).filter(x=>x.r&&x.r.verdict);
  const best=S.picks.find(x=>x.key===S.best), worst=S.picks.find(x=>x.key===S.worst);
  const liked=rated.filter(x=>x.r.verdict==="like");
  const cnt=(arr)=>{const m={};arr.forEach(k=>m[k]=(m[k]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const perUse=useKeys().filter(u=>u!=="general").map(u=>{
    const c=rated.filter(x=>x.r.effect[u]!=null).sort((a,b)=>(+b.r.effect[u])-(+a.r.effect[u]));
    return c.length && +c[0].r.effect[u]>=2 ? [`הכי עזר ל${esc(useLabel(u))}`, esc(pickName(c[0].pk))+pickTag(c[0].pk)] : null;
  }).filter(Boolean);
  const fx=cnt(rated.flatMap(x=>x.r.sidefx).filter(k=>k!=="other")).slice(0,3).map(([k])=>L("sidefx")[k]);
  const tastes=cnt(liked.flatMap(x=>x.r.deep.tastes).filter(k=>k!=="dunno")).slice(0,3).map(([k])=>L("tastes")[k]);
  const rows=[
    best?["הזן שהכי עזר לך",esc(pickName(best))+pickTag(best)]:null,
    worst?["הזן שהכי פחות עזר",esc(pickName(worst))+pickTag(worst)]:null,
    ...perUse,
    tastes.length?["טעמים בזנים שאהבת",tastes.join(", ")]:null,
    fx.length?["מה הכי הפריע לך",fx.join(", ")]:null,
    ["דירגת",`${rated.length} זנים · אהבת ${liked.length}`],
  ].filter(Boolean);
  return `<div class="summary">${rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}
    <p class="hint">זה סיכום של מה שענית, לא המלצה רפואית.</p></div>`;
}
function payload(){
  const ratings=Object.fromEntries(S.picks.map(pk=>{ const r=JSON.parse(JSON.stringify(S.ratings[pk.key]||{}));
    r.effect=Object.fromEntries(Object.entries(r.effect||{}).map(([u,v])=>[u,+v])); return [pk.key,r]; }));
  return JSON.parse(JSON.stringify({profile:S.profile,picks:S.picks,ratings,best:S.best,worst:S.worst,choose:S.choose,meta:{...S.meta,version:SURVEY_VERSION}}));
}
async function post(table,row){

    headers:{"apikey":SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function submit(){
  if(S.sent) return;
  if(!S.code){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; S.code=Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join(""); }
  S.meta.finished=new Date().toISOString();
  if(LIVE) await post("responses",{code:S.code,version:SURVEY_VERSION,data:payload()});
  S.sent=true;
}
async function sendContact(){
  const msg=$("contactMsg"), btn=$("contactBtn");
  const ph=S.contact.replace(/[^\d+]/g,"");
  if(ph.replace(/\D/g,"").length<9){ msg.textContent="נראה שהמספר לא שלם."; return; }
  btn.disabled=true;
  try{ if(LIVE) await post("contacts",{phone:ph}); S.contactSent=true; render(); }
  catch(e){ btn.disabled=false; msg.textContent="לא הצלחנו לשמור. בדוק שיש אינטרנט ונסה שוב."; }

/* ---------- navigation ---------- */
function canNext(){
  const s=S.step;
  if(s===2) return S.profile.uses.length>0 ? "" : "בחר לפחות דבר אחד שהקנאביס אמור לעזור בו";
  if(s===4) return S.picks.length>=2 ? "" : "בחר לפחות 2 זנים";
  if(s===5){ const r=S.ratings[S.picks[S.card].key]; return r&&r.verdict ? "" : "בחר אהבתי / לא בטוח / לא אהבתי"; }
  if(s===6){ const n=S.picks.filter(pk=>S.ratings[pk.key]&&S.ratings[pk.key].verdict).length; if(n<2) return ""; return S.best&&S.worst ? "" : "בחר את הזן שעזר הכי הרבה ואת זה שעזר הכי פחות"; }
  return "";
}
function go(step){ S.step=step; render(); window.scrollTo({top:0}); }
function next(){
  if(canNext()) return;
  if(S.step===0){ if(!S.meta.started) S.meta.started=new Date().toISOString(); return go(1); }
  if(S.step===4){ S.card=0; S.picks.forEach(pk=>ensureRating(pk.key)); return go(5); }
  if(S.step===5){ if(S.card<S.picks.length-1){ S.card++; render(); window.scrollTo({top:0}); return; } return go(6); }
  if(S.step===7){
    const nb=$("nextBtn"), why=$("why"); nb.disabled=true; nb.textContent="שולח...";
    submit().then(()=>go(8)).catch(()=>{ nb.disabled=false; nb.textContent="נסה שוב"; why.hidden=false; why.textContent="השליחה לא הצליחה. בדוק שיש אינטרנט ונסה שוב."; });
    return;
  }
  if(S.step<8) return go(S.step+1);
}
function back(){
  if(S.step===5 && S.card>0){ S.card--; render(); window.scrollTo({top:0}); return; }
  if(S.step===6){ S.card=Math.max(0,S.picks.length-1); return go(5); }
  if(S.step>0) go(S.step-1);
}

function render(){
  const s=S.step;
  $("top").hidden = s===0;
  $("nav").hidden = false;
  if(s>0){
    const within = s===5 ? ` · זן ${S.card+1} מתוך ${S.picks.length}` : "";
    $("pname").textContent = STEPS[s]+within;
    $("pcount").textContent = `שלב ${s} מתוך 8`;
    const frac = s===5 ? (5 + (S.card+1)/Math.max(1,S.picks.length) - 1)/8 : s/8;
    $("pbar").style.width = Math.round(frac*100)+"%";
  }
  const views=[vWelcome,vAbout,vWhy,vLikes,vPicks,vCard,vCompare,vChoose,vDone];
  $("app").innerHTML = views[s]();
  $("backBtn").hidden = s===0 || s===8;
  const nb=$("nextBtn");
  nb.textContent = s===0 ? "מסכים ומתחיל" : s===7 ? "סיום" : s===8 ? "סיימתי" : s===5 && S.card<S.picks.length-1 ? "לזן הבא" : "המשך";
  if(s===8){ nb.disabled=true; nb.textContent=LIVE?"התשובות נשמרו ✓":"תצוגה מקדימה: לא נשלח"; $("why").hidden=true; }
  else { const why=canNext(); nb.disabled=!!why; $("why").hidden=!why; $("why").textContent=why; }
  if(s===4) bindPicks();
  if(s===8){ const c=$("contact"); if(c) c.addEventListener("input",e=>{S.contact=e.target.value;}); }
  if(S.focus){ const el=document.querySelector(`[data-t="${S.focus}"]`); S.focus=null; if(el) el.focus(); }
  save();
}
function save(){ if(!LIVE) return; try{ localStorage.setItem(SAVE_KEY,JSON.stringify({t:Date.now(),S})); }catch(e){} }
function restore(){
  if(!LIVE) return;
  try{ const o=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(!o||!o.S) return;
    if(!o.S.sent && Date.now()-o.t>14*864e5) return;   /* stale unfinished run: start fresh */
    Object.assign(S,o.S); S.focus=null;
  }catch(e){}
}

function bindPicks(){
  const se=$("search"); se.addEventListener("input",e=>{ S.q=e.target.value; $("plist").innerHTML=plistHTML(); });
  const xn=$("xname"); xn.addEventListener("input",e=>{ S.xname=e.target.value; });
  const add=()=>{ const n=S.xname.trim(); if(!n) return; S.xcount++; S.picks.push({key:"x"+S.xcount,sku:null,name:n}); S.xname=""; render(); };
  $("xadd").addEventListener("click",add);
  xn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="nextBtn") return next();
  if(t.id==="backBtn") return back();
  if(t.id==="contactBtn") return sendContact();
  if(t.dataset.p){
    const path=t.dataset.p, v=t.dataset.v, cur=getP(path);
    if(Array.isArray(cur)){
      const i=cur.indexOf(v);
      if(i>=0){
        cur.splice(i,1);
        if(v==="other") setP(path+"Other","");
        if(path==="profile.uses") Object.values(S.ratings).forEach(r=>{ delete r.effect[v]; });
      } else {
        if(EXCL.has(v)) cur.splice(0,cur.length);
        else EXCL.forEach(x=>{ const j=cur.indexOf(x); if(j>=0) cur.splice(j,1); });
        cur.push(v);
        if(v==="other") S.focus=path+"Other";
      }
      if(path==="profile.uses" && cur.length) Object.values(S.ratings).forEach(r=>{ delete r.effect.general; });
    } else {
      const nv = (cur===v && path!=="profile.license") ? null : v;
      setP(path, nv);
      if(path==="profile.license"){ S.profile.licenseTouched=true; if(nv==="other") S.focus="profile.licenseOther"; else S.profile.licenseOther=""; }
      if(path.endsWith(".bothered") && (nv==="no"||nv===null)){ setP(path.replace(/\.bothered$/,".sidefx"),[]); setP(path.replace(/\.bothered$/,".sidefxOther"),""); }
      if(path.endsWith(".buys") && nv!=="2-3" && nv!=="4+") setP(path.replace(/\.buys$/,".deep.batches"),null);
      if(path==="best" && S.worst===S.best) S.worst=null;
    }
    render(); return;
  }
  if(t.dataset.stars){ const r=S.ratings[t.dataset.stars], n=+t.dataset.v; r.stars = r.stars===n?null:n; render(); return; }
  if(t.dataset.deep){ S.deepOpen[t.dataset.deep]=true; render(); return; }
  if(t.dataset.pick){ const sku=t.dataset.pick; const i=S.picks.findIndex(k=>k.sku===sku);
    if(i>=0) S.picks.splice(i,1); else S.picks.push({key:sku,sku,name:null});
    render(); return; }
  if(t.dataset.unpick){ const i=S.picks.findIndex(k=>k.key===t.dataset.unpick); if(i>=0) S.picks.splice(i,1); render(); return; }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.t){ setP(el.dataset.t, el.value); save(); }
});

$("previewNote").hidden=LIVE;
restore();
render();
</script>
